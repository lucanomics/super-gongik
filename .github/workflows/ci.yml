name: Parser format bootstrap

on:
  push:
    branches:
      - "feat/import-ui-xlsx-pdf"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/lib/file-import-adapters.ts
      - name: Commit formatted parser
        run: |
          if git diff --quiet; then
            echo "Parser formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/file-import-adapters.ts
          git commit -m "style(web): format HWP OCR adapters"
          git push origin HEAD:feat/import-ui-xlsx-pdf
