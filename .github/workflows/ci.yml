name: HWP export fix

on:
  push:
    branches:
      - "feat/import-ui-xlsx-pdf"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use named HwpxReader export
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/lib/file-import-adapters.ts')
          source = path.read_text()
          old = 'new hwpxModule.default()'
          new = 'new hwpxModule.HwpxReader()'
          if old not in source:
              raise SystemExit('Expected HWPX constructor expression not found')
          path.write_text(source.replace(old, new))
          PY
      - name: Commit HWP export fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/file-import-adapters.ts
          git commit -m "fix(web): use named HwpxReader export"
          git push origin HEAD:feat/import-ui-xlsx-pdf
